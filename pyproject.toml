[project]
name = "jp-quant"
version = "0.1.0"
description = "Personal investment data platform: leveraged-ETF strategy backtesting for a Japan-domiciled investor"
readme = "docs/spec.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=3.0",
    "pyarrow>=18",
    "numpy>=2.0",
    "yfinance>=1.4",
    "requests>=2.32",
    "fredapi>=0.5.2",
    "dagster>=1.13.6",
    "dagster-webserver>=1.13.6",
    "dagster-dbt>=0.29.6",
    "dbt-duckdb>=1.10.1",
    "certifi>=2026.5.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "pandas-stubs>=3.0",
    "types-requests>=2.32",
    "httpx>=0.27",
]

[tool.dagster]
module_name = "jp_quant.definitions"
code_location_name = "jp_quant"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_quant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "duckdb.*", "fredapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
